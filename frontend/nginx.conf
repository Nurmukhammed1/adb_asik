server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The site calls the API on its own address; nginx passes those calls on.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 600s;   # a similarity rebuild or accuracy check can take minutes on large datasets
  }

  # Every other address is a page of the single-page app.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
